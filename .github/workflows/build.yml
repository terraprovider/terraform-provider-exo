name: Build

# Validates that the release build compiles for every target platform, on every
# push, via a goreleaser snapshot (no publishing).
on: [workflow_dispatch, push]

permissions:
  contents: read

jobs:
  goreleaser-snapshot:
    runs-on: ubuntu-latest-8cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install aqua (pins goreleaser)
        uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.53.4
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: GoReleaser (snapshot build)
        run: goreleaser build --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
